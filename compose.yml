services:
  metersphere:
    image: ghcr.io/cangyangguang/metersphere:v0.2.2
    container_name: metersphere
    platform: linux/amd64
    ports:
      - "8085:8081"
    restart: unless-stopped
    volumes:
      - metersphere-conf:/opt/metersphere/conf
      - metersphere-data:/opt/metersphere/data
      - metersphere-logs:/opt/metersphere/logs
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

volumes:
  metersphere-conf:
    name: metersphere-conf
  metersphere-data:
    name: metersphere-data
  metersphere-logs:
    name: metersphere-logs
