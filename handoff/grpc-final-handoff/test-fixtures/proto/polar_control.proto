// ======================================================================
// 通用基础消息（复用）
// ======================================================================

/**
 * 应用操作请求
 *
 * - StartApplication / StopApplication：只使用 app_name
 * - UploadApplication：只使用 app_path
 */
message ApplicationRequest {
  /** 设备唯一标识 */
  string device_id = 1;

   /** appName（String）：应用名称 */
  string app_name = 2;

  /** appPath（String）：应用路径 */
  string app_path = 3;
}

/** 通用：操作返回 */
message OperationResult {
  bool success = 1;
  string message = 2;
  VariantValue data = 3;
}

/** ushort[] uint[]*/
message UIntArray {
  repeated uint32 values = 1;
}

/** short[] int[] */
message IntArray {
  repeated int32 values = 1;
}

/** float[] */
message FloatArray {
  repeated float values = 1;
}

/** double[] */
message DoubleArray {
  repeated double values = 1;
}

/** bool[] */
message BoolArray {
  repeated bool values = 1;
}

/** string[] */
message StringArray {
  repeated string values = 1;
}

message VariantValue {
  oneof kind {

    /** ushort */
    uint32 ushort_value = 1;

    /** uint */
    uint32 uint_value = 2;

    /** short */
    int32 short_value = 3;

    /** int */
    int32 int_value = 4;

    /** float */
    float float_value = 5;

    /** double */
    double double_value = 6;

    /** bool */
    bool bool_value = 7;

    string string_value= 8;

    /** ushort[] */
    UIntArray ushort_values = 9;

    /** uint[] */
    UIntArray uint_values = 10;

    /** short[]*/
    IntArray short_values = 11;

    /** int[]*/
    IntArray int_values = 12;

    /** float[] */
    FloatArray float_values = 13;

    /** double[] */
    DoubleArray double_values = 14;

    /** bool[] */
    BoolArray bool_values = 15;

    /** string[] */
    StringArray string_values = 16;
  }
}

// ======================================================================
// SERVICE — PROJECT
// ======================================================================

/*
 * 实验状态
 */
enum ExperimentState {
  //未连接
  EXPERIMENT_STATE_IDLE = 0;
  //已连接
  EXPERIMENT_STATE_ONLINE = 1;
  //观测中
  EXPERIMENT_STATE_MEASURING = 2;
  //未知状态
  EXPERIMENT_STATE_NONE = 3;
}

//实验响应模型
message ExperimentResponse {
  //实验名称
  string name = 1;
  //实验状态
  ExperimentState state = 2;
  //是否激活
  bool is_activated = 3;
}

//项目请求模型
message ProjectRequest {
  //项目目录
  string project_path = 1;
  //是否强制打开
  bool is_direct = 2;
}

//项目响应模型
message ProjectResponse {
  //项目名称
  string name = 1;
  //文件目录
  string local_path = 2;
  //所有实验
  repeated ExperimentResponse experiments = 3;
}

//版本响应模型
message VersionResponse {
  //版本号
  string version = 1;
}

//创建项目请求模型
message CreateProRequest {
  //项目目录
  string path = 1;
  //项目名称
  string project_name = 2;
  //实验名称
  string exp_name = 3;
}

//项目服务
service ProjectService {
  //加载项目
  rpc Load(ProjectRequest) returns (ProjectResponse) {
    option (google.api.http) = {
      post: "/v1/project/load"
      body: "*"
    };
  }
  //创建项目
  rpc Create(CreateProRequest) returns (ProjectResponse) {
    option (google.api.http) = {
      post: "/v1/project/create"
      body: "*"
    };
  }
  //保存项目
  rpc Save(google.protobuf.Empty) returns (google.protobuf.Empty){
      option (google.api.http) = {
      post: "/v1/project/save"
      body: "*"
    };
  }
  //关闭项目
  rpc CloseCurrent(google.protobuf.Empty) returns (google.protobuf.Empty){
      option (google.api.http) = {
      post: "/v1/project/close_current"
      body: "*"
    };
  }
  //获取当前项目
  rpc GetCurrent(google.protobuf.Empty) returns (ProjectResponse){
      option (google.api.http) = {
      post: "/v1/project/get_current"
      body: "*"
    };
  }
  //获取版本号
  rpc GetSoftVersion(google.protobuf.Empty) returns (VersionResponse){
       option (google.api.http) = {
      post: "/v1/project/get_soft_version"
      body: "*"
    };
  }
  //获取系统变量列表
  rpc ListSystemVariables(ListVariablesRequest) returns (ListVariablesReply){
        option (google.api.http) = {
      post: "/v1/project/list_system_variables"
      body: "*"
    };
  }
  //读取系统变量
  rpc ReadSystemVariable(ReadVariableRequest) returns (ReadVariableReply) {
    option (google.api.http) = {
      post: "/v1/project/systemvariable/read"
      body: "*"
    };
  }

  //写入系统变量
  rpc WriteSystemVariable(WriteVariableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/project/systemvariable/write"
      body: "*"
    };
  }
  
  //开始观测
  rpc StartMeasuring(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/project/start_measuring"
      body: "*"
    };
  }
  //停止观测
  rpc StopMeasuring(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/project/stop_measuring"
      body: "*"
    };
  }
  //上线
  rpc GoOnline(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/project/go_online"
      body: "*"
    };
  }
  //下线
  rpc GoOffline(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/project/go_offline"
      body: "*"
    };
  }
}


// ======================================================================
// SERVICE — RECORDER
// ======================================================================

//记录器请求
message RecorderRequest {
  //记录器名称
  string name = 1;
  oneof modify_oneof{
     //修改模型
    RecorderModify modify = 2;
  }
  //新建目录
  string file_path=3;
}

//记录器修改模型
message RecorderModify{
    oneof name_oneof{
        //记录器名称
        string name=1;
    }
    oneof is_split_file_oneof{
        //是否分割
        bool is_split_file=2;
    }
    oneof file_size_oneof{
        //文件大小（mb）
        int32 file_size=3;
    }
    oneof file_path_oneof{
        //保存目录
        string file_path=4;
    }
}

//记录器响应模型
message RecorderResponse {
  oneof search_type{
    //记录器集合
    RecorderList recorder_list=1;
    //单个记录器
    Recorder single=2;
  }
}

//记录器状态
enum RecorderStatus {
    //记录中
    recording=0;
    //等待规则通过
    waiting_for_record=1;
    //等待停止规则触发
    waiting_to_stop=2;
    //已停止
    stoped=3;
}

//文件类型
enum SignalRecorderType {
    //mf4格式
    mf4=0;
    //mat格式
    mat=1;
    //csv格式
    csv=2;
}

//记录器模型
message Recorder {
   //名称
  string name = 1;
  //记录器状态
  RecorderStatus status=2;
  //记录文件类型
  SignalRecorderType recorder_type=3;
  //文件保存目录
  string file_path =4;
  //bool is_activated = 5;
  reserved 5;
  //所有记录变量
  repeated RecorderVariable connected_variable = 6;
  //记录变量模型
  message RecorderVariable {
      //变量全局唯一路径
     string unique_path=1;
     //变量名称
     string name = 2;
     //显示层级路径
     string display_path = 3;
  }
  //是否分割文件
  bool is_split_file=7;
  //分割文件大小
  int32 file_size=8;
}
//记录器集合
message RecorderList {
    //所有记录器
    repeated Recorder Recorders=1;
}

//记录管理服务
service RecorderService {
  //获取所有记录器
  rpc GetAllRecorders(google.protobuf.Empty) returns (RecorderResponse){
         option (google.api.http) = {
      post: "/v1/recorder/get_all_recorders"
      body: "*"
    };
  }
  //获取单个记录器
  rpc GetRecorder(RecorderRequest) returns (RecorderResponse){
       option (google.api.http) = {
      post: "/v1/recorder/get_recorder"
      body: "*"
    };
  }
  //删除记录器
  rpc DeleteRecorder(RecorderRequest) returns (google.protobuf.Empty){
         option (google.api.http) = {
      post: "/v1/recorder/delete_recorder"
      body: "*"
    };
  }
  //创建记录器
  rpc Create(RecorderRequest) returns (google.protobuf.Empty){
         option (google.api.http) = {
      post: "/v1/recorder/create"
      body: "*"
    };
  }
  //修改记录器
  rpc Modify(RecorderRequest) returns (google.protobuf.Empty){
          option (google.api.http) = {
      post: "/v1/recorder/modify"
      body: "*"
    };
  }
  //开始记录
  rpc Start(RecorderRequest) returns(google.protobuf.Empty){
        option (google.api.http) = {
      post: "/v1/recorder/start"
      body: "*"
    };
  }
  //停止记录
  rpc Stop(RecorderRequest) returns(RecorderResponse){
       option (google.api.http) = {
      post: "/v1/recorder/stop"
      body: "*"
    };
  }
  //添加变量
  rpc AddRecordVariable(Recorder.RecorderVariable)returns(google.protobuf.Empty){
          option (google.api.http) = {
      post: "/v1/recorder/add_record_variable"
      body: "*"
    };
  }
  //删除变量
  rpc RemoveRecordVariable(Recorder.RecorderVariable)returns(google.protobuf.Empty){
        option (google.api.http) = {
      post: "/v1/recorder/remove_record_variable"
      body: "*"
    };
  }
}