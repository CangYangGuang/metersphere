syntax = "proto3";

/**
 * PolarControl gRPC API 统一接口定义
 * Version: 3.0
 * 支持：
 *  - 设备管理（列表、激活、状态）
 *  - 变量模型（Variable）
 *  - 变量读写（基于 UniquePath）
 *  - 通用命令（method + parameters）
 *  - 通用读写（Raw IO）
 *  - 项目管理
 *  - 记录器管理
 */

package Polar.v1;
option csharp_namespace = "PolarControl.SDK.Entity";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";


// ======================================================================
// ENUM — DEVICE STATE
// ======================================================================


/**
 * 设备运行状态
 */
enum DeviceRunningState {
  //未连接
  DEVICE_RUNNING_STATE_OFFLINE = 0;      
  //已连接
  DEVICE_RUNNING_STATE_ONLINE = 1;       
  //正在观测
  DEVICE_RUNNING_STATE_MEASURING = 2;    
  //未知状态
  DEVICE_RUNNING_STATE_NONE = 3;
}

/**
 * 设备类型
 */
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;

  DEVICE_TYPE_SPEEDGOAT = 1;

  reserved 2;

  DEVICE_TYPE_XCP_ON_ETHERNET = 3;

  DEVICE_TYPE_CAN = 4;

  DEVICE_TYPE_LIN = 5;

  DEVICE_TYPE_ETHERCAT = 6;

  reserved 7;

  DEVICE_TYPE_POLARBOX = 8;

  DEVICE_TYPE_SCPI = 9;

  DEVICE_TYPE_MODBUS = 10;

  DEVICE_TYPE_VISA = 11;

  DEVICE_TYPE_SOMEIP = 12;

  DEVICE_TYPE_DDS = 13;

  DEVICE_TYPE_SSH = 14;

  DEVICE_TYPE_RPC = 15;
}


// ======================================================================
// ENUM — VARIABLE TYPES
// ======================================================================

/**
 * 变量类型枚举
 */
enum VariableType {
  //未知类型
  VARIABLE_TYPE_UNKNOWN = 0;
  // 1x1 参数
  VARIABLE_TYPE_PARAMETER = 0x11; 
  // 1xN 或 Nx1
  VARIABLE_TYPE_AXIS = 0x12; 
  // 带轴的参数
  VARIABLE_TYPE_CURVE = 0x13;
  // 2D Map
  VARIABLE_TYPE_MAP = 0x14;   
  // n x n block
  VARIABLE_TYPE_VALUEBLOCK = 0x15;  
  // 3D 数据块
  VARIABLE_TYPE_CUBOID = 0x16;  
  // 4 维参数块
  VARIABLE_TYPE_CUBOID_4 = 0x17; 
  // 5 维参数块
  VARIABLE_TYPE_CUBOID_5 = 0x18;             
  // 信号
  VARIABLE_TYPE_SIGNAL = 0x22;
  // 测量数组
  VARIABLE_TYPE_MEASUREMENT_ARRAY = 0x23;    
  // 系统变量
  VARIABLE_TYPE_SYSTEM_VARIABLE = 0x31;      
  // 消息
  VARIABLE_TYPE_MESSAGE = 0x40;     
  // 结构体
  VARIABLE_TYPE_STRUCT = 0x41;  
  // 字符串
  VARIABLE_TYPE_STRING = 0x50;               
}


// ======================================================================
// MODEL — VARIABLE
// ======================================================================

/**
 * 变量信息（设备下的单个变量）
 */
message VariableInfo {
  // 变量名称
  string name = 1;
  // UI显示路径（父层级）
  string display_path = 2; 
  // 唯一变量路径（关键）
  string unique_path = 3;
  // 类型
  VariableType variable_type = 4;              
  // 当前变量值（json 结构：string/number/list/struct）
  //google.protobuf.Value value = 5;   
}

/**
 * 请求设备变量列表
 */
message ListVariablesRequest {
  //如果是系统环境变量忽略该值
  string device_id = 1;
  //每页数量
  int32 page_size = 2;
  //页码
  int32 page_index = 3;
}

/**
 * 返回设备变量列表
 */
message ListVariablesReply {
  //变量信息列表
  repeated VariableInfo variables = 1;
  //分页总数
  int32 page_count=2;
  //页码
  int32 page_index=3;
}

/**
 * 读取变量请求
 */
message ReadVariableRequest {
  //设备ID，系统变量忽视该字段
  string device_id = 1; 
  //设备变量使用display_path，系统变量使用unique_path
  string variable_path = 2;          
}

/**
 * 读取变量响应
 */
message ReadVariableReply {
  //bool success = 1;
  //string error_message = 2;
  reserved 1;
  reserved 2;
  // 变量值
  google.protobuf.Value value = 3;      
  // 可选：变量描述
  VariableInfo variable = 4;            
}

/**
 * 写入变量请求
 */
message WriteVariableRequest {
  //设备Id
  string device_id = 1;
  //传入DisplayPath
  string variable_path = 2;
  // 写入的值
  google.protobuf.Value value = 3;      
}

// ======================================================================
// MODEL — DEVICE INFO
// ======================================================================

/**
 * 设备基础信息
 */
message DeviceInfo {
  //设备唯一 ID
  string id = 1;                            
  //设备名称
  string name = 2;  
  //是否启用
  bool is_activated = 3;  
  //统一运行状态
  DeviceRunningState running_state = 4;     
  //设备类型
  DeviceType device_type = 5;               
}

/**
 * 查询设备列表
 */
message ListDevicesRequest {
  //可按类型过滤
  DeviceType type_filter = 1;               
}

//设备集合模型
message ListDevicesReply {
  //设备集合
  repeated DeviceInfo devices = 1;
}
//设备激活请求模型
message ChangeDeviceActiveRequest {
   //设备ID
  string device_id = 1;
}


// ======================================================================
// SERVICE — DEVICE SERVICE
// ======================================================================

//设备服务
service DeviceService {
   //获取所有设备
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesReply) {
    option (google.api.http) = {
      get: "/v1/devices"
    };
  }
  //激活设备
  rpc ActivateDevice(ChangeDeviceActiveRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/activate"
      body: "*"
    };
  }
  //反激活设备
  rpc DeactivateDevice(ChangeDeviceActiveRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/deactivate"
      body: "*"
    };
  }

   /**
   * 获取设备全部变量
   */
  rpc ListVariables(ListVariablesRequest) returns (ListVariablesReply) {
    option (google.api.http) = {
      get: "/v1/device/{device_id}/variables"
      body: "*"
    };
  }

  /**
   * 读取设备变量
   */
  rpc ReadVariable(ReadVariableRequest) returns (ReadVariableReply) {
    option (google.api.http) = {
      post: "/v1/device/variable/read"
      body: "*"
    };
  }

  /**
   * 写入设备变量
   */
  rpc WriteVariable(WriteVariableRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/variable/write"
      body: "*"
    };
  }
  //执行内部方法
  rpc Execute(GenericCommandRequest) returns (GenericCommandReply) {
    option (google.api.http) = {
      post: "/v1/device/execute"
      body: "*"
    };
  }
}

/**
 * 通用命令请求
 */
message GenericCommandRequest {
  //设备id
  string device_id = 1;
  // 命令名称，例如 "SendFrame"
  string method = 2;                       
  // 参数集合
  repeated google.protobuf.Value parameters = 3;       
}

/**
 * 通用命令响应
 */
message GenericCommandReply {
  //返回的结果
  google.protobuf.Value result = 1;            
}


// ======================================================================
// CAN 设备服务
// ======================================================================

/**
 * CAN 设备服务
 *
 * - SendCANFrame：发送 CAN 帧
 * - SendJ1939Frame：发送 J1939 CAN 帧
 */
service CanService {

  /**
   * 发送 CAN 帧
   */
  rpc SendCANFrame(SendCANFrameRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/can/send"
      body: "*"
    };
  }

  /**
   * 发送 J1939 CAN 帧
   */
  rpc SendJ1939Frame(SendJ1939FrameRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/can/j1939/send"
      body: "*"
    };
  }
}

/** SendCANFrame 请求 */
message SendCANFrameRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** CanId（UInt）：CAN 报文 ID */
  uint32 can_id = 2;

  /** Data（Byte[]）：CAN 数据 */
  bytes data = 3;

  /** Type（int）：帧类型（Std：标准帧，Ext：扩展帧） */
  int32 type = 4;

  /** Format（int）：格式（Rtr：远程帧，Data：数据帧） */
  int32 format = 5;

  /** IsFD（Boolean）：是否 CAN-FD */
  bool is_fd = 6;

  /** IsBRS（Boolean）：是否开启 BRS */
  bool is_brs = 7;
}


/** SendJ1939Frame 请求 */
message SendJ1939FrameRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** id（UInt）：J1939 报文 ID */
  uint32 id = 2;

  /** data（Byte[]）：报文数据 */
  bytes data = 3;

  /** IsFD（Boolean）：是否 CAN-FD */
  bool is_fd = 4;

  /** IsBRS（Boolean）：是否开启 BRS */
  bool is_brs = 5;
}

// ======================================================================
// LIN 设备服务
// ======================================================================

/**
 * LIN 设备服务
 *
 * - SendLINFrame：主站发送 LIN 帧
 * - SwitchTask：修改从站状态
 * - SetSlaveTask：设置从站任务
 */
service LinService {

  /**
   * 主站发送 LIN 帧
   *
   * 入参：
   * 1. CanId（byte）
   * 2. Data（Byte[]）
   * 3. dlc（byte）
   * 4. checksumType（int）
   *
   * 出参：
   * - true（Boolean）：是否成功
   */
  rpc SendLINFrame(LINRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/lin/send"
      body: "*"
    };
  }

  /**
   * 修改从站状态（CSV：SwitchTask）
   */
  rpc SwitchTask(LINRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/lin/slave/switch"
      body: "*"
    };
  }

  /**
   * 设置从站任务（CSV：SetSlaveTask）
   */
  rpc SetSlaveTask(LINRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/lin/slave/task/set"
      body: "*"
    };
  }
}

/** SendLINFrame 请求 */
message LINRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** linId（byte）：取值范围 0~255 */
  uint32 lin_id = 2;

  /** Data（Byte[]）：帧数据 */
  bytes data = 3;

  /** dlc（byte）：数据长度，取值范围 0~255 */
  uint32 dlc = 4;

  /**
   * slaveMode：校验和
   * - true：增强型校验和（enhanced checksum）
   * - false：经典校验和（classic checksum）
   */
  bool is_enhanced_checksum = 5;

  /**
   * slaveMode（int）：从站模式
   * - true：ON
   * - false：OFF
   */
  bool slave_mode = 6;
}



// ======================================================================
// SCPI 设备服务
// ======================================================================

/**
 * SCPI 设备服务
 * - SendCommand：发送指定命令，获取返回数据
 */
service ScpiService {

  /**
   * 发送 SCPI 命令
   */
  rpc SendCommand(ScpiSendCommandRequest) returns (OperationResult) {
    option (google.api.http) = {
      post: "/v1/device/scpi/command"
      body: "*"
    };
  }
}

/** SCPI SendCommand 请求 */
message ScpiSendCommandRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** command（string）：发送指令 */
  string command = 2;

  /** isNeedResponse（bool）：是否需要返回值 */
  bool is_need_response = 3;
}


// ======================================================================
// VISA 设备服务
// ======================================================================

/**
 * VISA 设备服务
 *
 * 对应 CSV：VISA设备
 * - GetSnapShot：获取波形数据
 * - ScreenShot：示波器截图
 */
service VisaService {

  /**
   * 获取波形数据（CSV：GetSnapShot）
   */
  rpc GetSnapShot(VisaGetSnapShotRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/v1/device/visa/snapshot"
      body: "*"
    };
  }

  /**
   * 示波器截图（CSV：ScreenShot）
   *
   */
  rpc TakeScreenshot(VisaScreenShotRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/visa/screenshot"
      body: "*"
    };
  }
}

/** VISA GetSnapShot 请求 */
message VisaGetSnapShotRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** data（string[]）：获取变量数组，例如 CH1、CH2 */
  repeated string data = 2;

  /** path（string）：波形数据存储路径 */
  string path = 3;
}

/** VISA ScreenShot 请求 */
message VisaScreenShotRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** savepath（string）：截图保存路径 */
  string savepath = 2;
}

// ======================================================================
// Modbus 设备服务
// ======================================================================

/**
 * Modbus 设备服务
 *
 */
service ModbusService {

  /**
   * 自定义读取 Modbus 数据
   */
  rpc ReadRaw(ModbusReadRawRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/modbus/read"
      body: "*"
    };
  }

   /**
   * 写入单个寄存器
   */
  rpc WriteRegister(ModbusWriteRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/modbus/register/write"
      body: "*"
    };
  }

  /**
   * 批量写入寄存器或线圈
   *
   */
  rpc WriteMultipleValues(ModbusWriteRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/modbus/register/write-multiple"
      body: "*"
    };
  }

  /**
   * 写入线圈
   */
  rpc WriteCoil(ModbusWriteRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/modbus/coil/write"
      body: "*"
    };
  }
}

/** Modbus ReadRaw 请求 */
message ModbusReadRawRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** fuctionType（string）：功能类型 */
  string fuction_type = 2;

  /** dataType（string）： */
  string data_type = 3;

  /** address（string）：读取起始地址 */
  string address = 4;

  /** length（ushort）：读取长度（0~65535） */
  uint32 length = 5;

  /** isArray（bool）：是否为数组 */
  bool is_array = 6;
}


/**
 * Modbus 寄存器写入请求
 *
 * 可用于：
 * - 写单个寄存器
 * - 批量写寄存器
 */
message ModbusWriteRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** 起始寄存器地址 */
  string address = 2;

  /** 写入的寄存器值 */
  VariantValue value = 3;
}

/**
 * Modbus 寄存器写入值
 *
 * - 支持单值或同构数组
 * - 同一请求中只能选择一种类型
 */


// ======================================================================
// EtherCAT 设备服务
// ======================================================================

/**
 * EtherCAT 设备服务
 */
service EtherCATService {

  /**
   * 获取从站列表
   *
   * 出参：
   * - List<int>：从站设备ID列表
   */
  rpc GetSalveInfo(EtherCATRequest) returns (EtherCATGetSlaveInfoReply){
    option (google.api.http) = {
      post: "/v1/device/ethercat/slaves"
      body: "*"
    };
  }

  /**
   * eeprom 文件下载
   *
   * 入参：
   * 1. slaveId（Int）：从站 ID
   * 2. filePath（String）：文件路径
   *
   * 出参：
   * - true（Boolean）：是否成功
   */
  rpc EepRomDownload(EtherCATRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/v1/device/ethercat/eeprom/download"
      body: "*"
    };
  }

  /**
   * eeprom 文件更新
   *
   * 入参：
   * 1. slaveId（Int）：从站 ID
   * 2. filePath（String）：文件路径
   *
   * 出参：
   * - true（Boolean）：是否成功
   */
  rpc EepRomUpload(EtherCATRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/v1/device/ethercat/eeprom/upload"
      body: "*"
    };
  }

  /**
   * 固件更新
   */
  rpc FirmUpdate(EtherCATRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/v1/device/ethercat/firmware/update"
      body: "*"
    };
  }

  /**
   * 设置从站状态
   */
  rpc SetState(EtherCATRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/device/ethercat/slave/state"
      body: "*"
    };
  }
}

/** EtherCAT 获取从站信息请求 */
message EtherCATGetSlaveInfoRequest {
  /** 设备唯一标识 */
  string device_id = 1;
}

/** 单个从站信息*/
message EtherCATSlaveInfo {
  /** 从站信息 */
  google.protobuf.Struct data = 1;
}

/** EtherCAT 获取从站信息响应 */
message EtherCATGetSlaveInfoReply {
  /** 从站设备列表*/
  repeated int32 slaves = 1;
}

/** EtherCAT 文件操作请求（Download/Upload/FirmUpdate 共用） */
message EtherCATRequest {
  /** 设备唯一标识 */
  string device_id = 1;

  /** slaveId（Int）：从站 ID */
  uint32 slave_id = 2;

  /** filePath（String）：文件路径 */
  string file_path = 3;

    /**
   * 从站状态
   *    None,
   *    Init,
   *    PreOp,
   *    Boot ,
   *    SafeOp,
   *    Operational ,
   *    AckOrError
   */
  string target_state = 4;
}



// ======================================================================
// Speedgoat 设备服务
// ======================================================================

/**
 * Speedgoat 设备服务
 *
 */
service SpeedgoatService {

  /** 启动应用 */
  rpc StartApplication(ApplicationRequest) returns (OperationResult) {
    option (google.api.http) = {
      post: "/v1/device/speedgoat/application/start"
      body: "*"
    };
  }

  /** 停止应用 */
  rpc StopApplication(ApplicationRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/speedgoat/application/stop"
      body: "*"
    };
  }

  /** 上传应用*/
  rpc UploadApplication(ApplicationRequest) returns (OperationResult){
    option (google.api.http) = {
      post: "/v1/device/speedgoat/application/upload"
      body: "*"
    };
  }

  /** 重启设备*/
  rpc RebootDevice(ApplicationRequest) returns (google.protobuf.Empty){
    option (google.api.http) = {
      post: "/v1/device/speedgoat/application/reboot"
      body: "*"
    };
  }
}

